name: DevTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Prevent duplicate parallel runs on the same branch/PR; cancel obsolete runs in-progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  sanity-check:
    name: Repository Sanity & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Verify repository structure and Git commit
        run: |
          echo "=== Pipeline Triggered Successfully ==="
          echo "Running on runner OS: $(uname -s) $(uname -m)"
          echo "Triggered by actor: ${{ github.actor }}"
          echo "Triggered on event: ${{ github.event_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=== Checking Critical Directories ==="
          test -d backend && echo "✔ backend directory found"
          test -d frontend && echo "✔ frontend directory found"
          test -f docker-compose.yml && echo "✔ docker-compose.yml found"
          test -f backend/Dockerfile && echo "✔ backend Dockerfile found"
          test -f frontend/Dockerfile && echo "✔ frontend Dockerfile found"

  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/devtrack_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/devtrack_test
        run: |
          cd backend
          pytest -v tests/

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies reproducibly
        run: |
          cd frontend
          npm ci

      - name: Run production build (Vite)
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    # Only publish images on push to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Normalize repository owner to lowercase for Docker
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-backend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-frontend:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on Backend image
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Frontend image
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ env.IMAGE_OWNER }}/devtrack-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'