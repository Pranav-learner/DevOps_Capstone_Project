name: DevTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sanity-check:
    name: Repository Sanity & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Verify repository structure and Git commit
        run: |
          echo "=== Pipeline Triggered Successfully ==="
          echo "Running on runner OS: $(uname -s) $(uname -m)"
          echo "Triggered by actor: ${{ github.actor }}"
          echo "Triggered on event: ${{ github.event_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=== Checking Critical Directories ==="
          test -d backend && echo "✔ backend directory found"
          test -d frontend && echo "✔ frontend directory found"
          test -f docker-compose.yml && echo "✔ docker-compose.yml found"
          test -f backend/Dockerfile && echo "✔ backend Dockerfile found"
          test -f frontend/Dockerfile && echo "✔ frontend Dockerfile found"

  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Apply database migrations (Alembic)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/devtrack_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/devtrack_test
        run: |
          cd backend
          pytest -v tests/

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies reproducibly
        run: |
          cd frontend
          npm ci

      - name: Run production build (Vite)
        run: |
          cd frontend
          npm run build
  
    docker-build:
    name: Build Docker Images (Quality Gate Check)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: devtrack-backend:test

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: devtrack-frontend:test
