apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devtrack-monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: devtrack-monitoring
    app.kubernetes.io/part-of: devtrack-observability
spec:
  project: default
  source:
    repoURL: https://github.com/Pranav-learner/DevOps_Capstone_Project.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
